<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 먹지? 🍱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>🍱 오늘 뭐 먹지?</h1>
    <p class="subtitle">점심 메뉴 고민은 룰렛에게 맡기세요</p>
  </header>

  <main class="layout">
    <section class="col">
      <!-- 필터 -->
      <div class="card">
        <fieldset class="lock-group">
          <h2 class="card-title">🔍 필터</h2>
          <div class="chips" role="group" aria-label="카테고리">
            <button type="button" class="chip" data-category="한식" aria-pressed="true">🍚 한식</button>
            <button type="button" class="chip" data-category="일식" aria-pressed="true">🍣 일식</button>
            <button type="button" class="chip" data-category="양식" aria-pressed="true">🍝 양식</button>
          </div>

          <div class="exclude-row">
            <label class="switch">
              <input type="checkbox" id="excludeToggle" aria-label="최근 먹은 메뉴 제외">
              <span class="slider" aria-hidden="true"></span>
            </label>
            <span>최근</span>
            <select id="excludeDays" aria-label="제외 기간">
              <option value="1">1일</option>
              <option value="2">2일</option>
              <option value="3">3일</option>
              <option value="4">4일</option>
              <option value="5">5일</option>
              <option value="6">6일</option>
              <option value="7">7일</option>
            </select>
            <span>안에 먹은 메뉴 제외</span>
          </div>
          <p class="summary" id="excludeSummary"></p>
          <p class="summary" id="skippedRow" hidden>
            <span id="skippedText"></span>
            <button type="button" class="btn-link" id="unskipBtn">되돌리기</button>
          </p>
        </fieldset>
      </div>

      <!-- 룰렛 -->
      <div class="card wheel-card">
        <div class="wheel-wrap" id="wheelWrap">
          <div class="pointer" aria-hidden="true">▼</div>
          <canvas id="wheel" role="img" aria-label="메뉴 룰렛"></canvas>
          <p class="wheel-empty" id="wheelEmpty" hidden></p>
        </div>
        <p class="wheel-info" id="wheelInfo"></p>
        <div class="wheel-actions">
          <button type="button" class="btn btn-primary btn-big" id="spinBtn">🎲 돌리기</button>
          <button type="button" class="btn btn-ghost" id="shuffleBtn" hidden>🔀 섞기</button>
        </div>
      </div>
    </section>

    <section class="col">
      <!-- 메뉴 관리 -->
      <div class="card">
        <fieldset class="lock-group">
          <h2 class="card-title">📝 메뉴 관리</h2>
          <form class="add-form" id="addForm" novalidate>
            <input type="text" id="menuName" placeholder="메뉴 이름" maxlength="12" aria-label="메뉴 이름">
            <select id="menuCategory" aria-label="카테고리">
              <option value="한식">🍚 한식</option>
              <option value="일식">🍣 일식</option>
              <option value="양식">🍝 양식</option>
            </select>
            <button type="submit" class="btn btn-primary">추가</button>
          </form>
          <p class="form-msg" id="formMsg" role="status"></p>
          <div id="menuList"></div>
          <button type="button" class="btn-link restore" id="restoreBtn">기본 메뉴 복원</button>
        </fieldset>
      </div>

      <!-- 최근 기록 -->
      <div class="card">
        <fieldset class="lock-group">
          <div class="card-head">
            <h2 class="card-title">🗓️ 최근 먹은 기록</h2>
            <button type="button" class="btn-link" id="clearHistoryBtn">전체 삭제</button>
          </div>
          <ul class="history" id="historyList"></ul>
        </fieldset>
      </div>
    </section>
  </main>

  <!-- 결과 모달 -->
  <div class="modal" id="resultModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultName">
      <p class="modal-label" id="resultTitle">🎉 오늘의 메뉴는…</p>
      <p class="result-name" id="resultName"></p>
      <p class="result-cat" id="resultCat"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="eatBtn">✅ 이거 먹을게요</button>
        <button type="button" class="btn btn-ghost" id="retryBtn">🔄 다시</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
